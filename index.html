<script>
/* MakkaPakka RRR home shortcut */
(function () {
  let rrrTapCount = 0;
  let rrrResetTimer = null;

  window.addEventListener("keydown", function (event) {
    if (!event.key || event.key.toLowerCase() !== "r") {
      if (!event.repeat) {
        rrrTapCount = 0;
        clearTimeout(rrrResetTimer);
      }
      return;
    }

    const target = event.target;
    if ((target instanceof Element && target.closest("input, textarea, select, [contenteditable='true'], [contenteditable='']")) ||
        event.ctrlKey || event.altKey || event.metaKey) {
      return;
    }

    event.preventDefault();
    event.stopImmediatePropagation();
    if (event.repeat) return;

    rrrTapCount += 1;
    clearTimeout(rrrResetTimer);

    if (rrrTapCount === 3) {
      rrrTapCount = 0;
      window.location.href = "https://makkapakka-7788.github.io/makkapakka/flashcard.html";
      return;
    }

    rrrResetTimer = setTimeout(function () {
      rrrTapCount = 0;
    }, 850);
  }, true);
})();
</script>

<script>
if (document.documentMode) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("browser-warning").style.display = "flex";
}

let rCount = 0;
let rTimer = null;

document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() !== "r" || e.ctrlKey || e.altKey || e.metaKey) {
        return;
    }

    const target = e.target;
    if (target && (
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.isContentEditable
    )) {
        return;
    }

    rCount++;
    clearTimeout(rTimer);

    rTimer = setTimeout(function() {
        rCount = 0;
    }, 700);

    if (rCount === 3) {
        rCount = 0;
